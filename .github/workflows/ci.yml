name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  analysis-tests:
    # Pure-function pytest suite under analysis/tests/. Every test reads
    # fixtures or committed files; none queries BigQuery or touches the
    # network, so nothing is deselected. Includes
    # test_committed_measures_json_matches_the_generator, which fails when
    # frontend/public/api/v1/measures.json is edited by hand or left stale
    # after a source file it reads changes.
    name: Analysis unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r analysis/requirements-test.txt

      # `python -m` puts the repo root on sys.path, which is what lets the
      # tests `from analysis import ...`. A bare `pytest` does not.
      - name: pytest analysis/tests
        run: python -m pytest analysis/tests/ -q

      # Fails if an NPI removed on request (analysis/suppression.py) appears
      # in frontend/public/api/v1; docs/ and release snapshots only warn.
      # Prints file paths and counts only. Uses the read-only reader role
      # (SELECT npi). Passes with a warning when no list is configured, which
      # is the case on forks, where secrets are empty.
      - name: Suppressed NPIs are absent from published files
        env:
          SUPPRESSION_READER_URL: ${{ secrets.SUPPRESSION_READER_URL }}
          SUPPRESSED_NPIS: ${{ secrets.SUPPRESSED_NPIS }}
        run: |
          if [ -n "$SUPPRESSION_READER_URL" ]; then pip install "psycopg[binary]>=3.1,<4" >/dev/null; fi
          python analysis/suppression.py --check

  contract:
    name: Public contract validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: pip install jsonschema

      # Schema conformance plus the invariants a schema cannot express:
      # provenance matching the pinned release, numerator <= denominator in the
      # same unit, findings.ts agreeing with the published JSON, every manifest
      # URL resolving, and cross-finding agreements. Every defect this repo
      # shipped in August was well-formed JSON.
      - name: Validate /api/v1 contract
        run: python analysis/validate_contract.py

      # The published schemas must match the ones the validator enforces, or
      # an external consumer validates against a stale contract.
      - name: Schemas are up to date
        run: |
          python analysis/validate_contract.py --write-schemas
          if ! git diff --quiet frontend/public/api/v1/schemas/; then
            echo "::error::Published schemas differ from contract_schemas.py."
            echo "Run: python analysis/validate_contract.py --write-schemas"
            git --no-pager diff --stat frontend/public/api/v1/schemas/
            exit 1
          fi

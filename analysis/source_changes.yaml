# Curated log of changes to the CMS National Directory of Healthcare (NDH) bulk
# export, and two upstream files outside it, that changed how AINPI must read
# its inputs. Written by hand, reviewed by pull request, validated and
# published by analysis/source_changes.py to
# frontend/public/api/v1/source-changes.json.
#
# Fields: id (sc-YYYY-MM-DD-<slug>, date = first_release), first_release,
# resource, element, kind, before, after, detected, impact, handled_by
# (path:symbol), evidence (repo path or https://ainpi.dev/ URL), status.
# Entries from 2026-11-01 also need evidence_ref (a fingerprint diff line or a
# dq-results key). kind: upstream-file marks files outside the NDH.
#
# Figures appear only where a committed published file or run doc carries them.
entries:
  - id: sc-2026-05-08-npi-identifier-system-url
    first_release: "2026-05-08"
    resource: Practitioner, Organization
    element: identifier.system
    kind: identifier
    before: "http://hl7.org/fhir/sid/us-npi"
    after: "http://terminology.hl7.org/NamingSystem/npi"
    detected: "May 2026 (exact date not recorded). A parser that matched only the old URL lost every NPI in the release without raising an error."
    impact: "Any parser matching the old system URL alone returned no NPIs for the 2026-05-08 release. The failure was an empty result, not an exception, so nothing downstream noticed."
    handled_by: "analysis/fhir_identifiers.py:extract_npis"
    evidence: analysis/fhir_identifiers.py
    status: resolved

  - id: sc-2026-05-08-endpoint-location-id-reminted
    first_release: "2026-05-08"
    resource: Endpoint, Location
    element: id
    kind: id-minting
    before: "Endpoint-<UUID> and Location-<UUID> ids in the 2026-04-09 release"
    after: "A new set of Endpoint-<UUID> and Location-<UUID> ids; none carried over from 2026-04-09"
    detected: "2026-08-23, cross-release id comparison of the 2026-04-09 and 2026-05-08 parquet exports."
    impact: "A cross-release diff of Endpoint or Location joined on id reports 100% churn, which is an artifact of id minting rather than a measurement. Endpoint joins cleanly on address instead. Location has no reliable key in the exported columns, so any Location cross-release join is lossy."
    handled_by: "analysis/databricks_publish.py:TABLE_COMMENTS"
    evidence: docs/methodology/runs/2026-08-23-cross-release-id-stability.md
    status: active

  - id: sc-2026-05-08-practitioner-extension-vocabulary
    first_release: "2026-05-08"
    resource: Practitioner
    element: extension.url
    kind: vocabulary
    before: "Universal practitioner extensions such as base-ext-enrollment-validated and base-ext-cms-ial2-verified"
    after: "A different set, such as base-ext-hhs-in-exclusion-list and base-ext-cms-identity-verified, with no overlap; two of the new names use snake_case"
    detected: "2026-08-23, record-level comparison of practitioners present in both the 2026-04-09 and 2026-05-08 releases."
    impact: "Matching an extension name from one release against another returns zero rows and does not error. Practitioner ids overlap fully across the two releases, but no sampled record is identical, so a stable id does not mean unchanged content."
    handled_by: docs/methodology/runs/2026-08-23-cross-release-id-stability.md
    evidence: docs/methodology/runs/2026-08-23-cross-release-id-stability.md
    status: active

  - id: sc-2026-08-20-manifest-key-renumbering
    first_release: "2026-08-20"
    resource: manifest.json
    element: files keys
    kind: file-layout
    before: "Dated keys such as Practitioner_2026-05-07_2128.ndjson"
    after: "Numbered keys without a date, such as 06-Practitioner.ndjson"
    detected: "August 2026, when ingestion of the new release resolved no files."
    impact: "The old prefix matcher resolved nothing, which blocked ingestion. The release date could no longer be read from a filename, so it resolved to unknown unless taken from the manifest generated_at field. A second lookup that kept the old matcher silently stopped checking download sizes until both were moved onto one shared matcher."
    handled_by: "analysis/ndh_manifest.py:_matching_keys"
    evidence: analysis/tests/test_ndh_manifest.py
    status: resolved

  - id: sc-2026-08-20-new-resource-types
    first_release: "2026-08-20"
    resource: HealthcareService, InsurancePlan
    element: bulk export files
    kind: file-layout
    before: "Six resource files: Practitioner, PractitionerRole, Organization, OrganizationAffiliation, Location, Endpoint"
    after: "Eight files: HealthcareService and InsurancePlan added"
    detected: "August 2026, while resolving the renumbered manifest."
    impact: "The export grew from six files to eight. The two new types are resolvable by name but have no warehouse tables yet; they are listed apart from the six ingested resources so that discovery does not turn into a failing load."
    handled_by: "analysis/ndh_manifest.py:NDH_NEW_RESOURCES"
    evidence: analysis/ndh_manifest.py
    status: active

  - id: sc-2026-08-20-endpoint-location-id-reminted
    first_release: "2026-08-20"
    resource: Endpoint, Location
    element: id
    kind: id-minting
    before: "Endpoint-<UUID> and Location-<UUID> ids in the 2026-05-08 release"
    after: "A new set of ids; none carried over from 2026-05-08"
    detected: "2026-10-16, cross-release id comparison on the Delta archive (2026-05-08 against 2026-08-20)."
    impact: "An id join across 2026-05-08 and 2026-08-20 reports 100% false churn for both resources. Join Endpoint on address; Location has no reliable key."
    handled_by: "analysis/databricks_publish.py:TABLE_COMMENTS"
    evidence: analysis/databricks_publish.py
    status: active

  - id: sc-2026-10-07-endpoint-location-id-partial-carryover
    first_release: "2026-10-07"
    resource: Endpoint, Location
    element: id
    kind: id-minting
    before: "No id carried over between consecutive releases in the two earlier pairs"
    after: "Most ids carried over from 2026-08-20 to 2026-10-07: 983,770 of 1,128,169 endpoint ids and 2,320,667 of 2,535,686 location ids"
    detected: "Date not recorded; measured by comparing the 2026-08-20 and 2026-10-07 partitions of the Delta archive."
    impact: "Whether an id join shows false churn now depends on the release pair, and nothing promises the carry-over will hold. The rule is unchanged: join Endpoint on address for every release pair."
    handled_by: "analysis/databricks_publish.py:ID_NOTE_ENDPOINT"
    evidence: analysis/databricks_publish.py
    status: active

  - id: sc-2026-08-20-taxonomy-system-valueset
    first_release: "2026-08-20"
    resource: Practitioner, PractitionerRole
    element: qualification.code.coding.system, specialty.coding.system
    kind: code-system
    before: "http://nucc.org/provider-taxonomy"
    after: "http://hl7.org/fhir/us/ndh/ValueSet/HealthcareIndividualTaxonomyVS, a ValueSet canonical used where FHIR requires a CodeSystem canonical"
    detected: "2026-08-21, re-running H10 to H13 on the new release."
    impact: "Matching the old URL returned zero rows without an error. The first run on the new release reported no practitioners with a taxonomy code and zero specialty validity, both artifacts of the match. The codes under the new URL are ordinary NUCC codes."
    handled_by: "analysis/h10_h13_with_crosswalk.py:tax_sys"
    evidence: analysis/h10_h13_with_crosswalk.py
    status: resolved

  - id: sc-2026-08-20-role-specialty-nucc
    first_release: "2026-08-20"
    resource: PractitionerRole
    element: specialty.coding.code
    kind: vocabulary
    before: "CMS Medicare specialty codes, such as 14-50, through the 2026-05-08 release"
    after: "NUCC taxonomy codes, such as 207R00000X"
    detected: "2026-08-21, re-running the findings on the new release."
    impact: "The internal-consistency figure published for months compared role specialty with practitioner taxonomy through the lossy Medicare-to-NUCC crosswalk, so it measured the crosswalk and not disagreement. Both fields now use NUCC and can be compared directly."
    handled_by: "analysis/h10_h13_with_crosswalk.py:tax_sys"
    evidence: frontend/public/api/v1/findings/npi-taxonomy-correctness.json
    status: resolved

  - id: sc-2026-08-20-ein-organization-records
    first_release: "2026-08-20"
    resource: Organization
    element: type[0].text
    kind: value-pattern
    before: "Organization records predominantly typed as provider organizations"
    after: "Records typed only as tax-ID records (text 'ein', no provider type) made up about half of the file: 2,199,519 of 4,402,671 at 2026-08-20, then 79,721 at 2026-10-07"
    detected: "October 2026, comparing the 2026-10-07 reload with 2026-08-20 (release-deltas.json)."
    impact: "Organization counts mix provider organizations and tax records, and nearly all of the Organization drop from August to October is the tax records leaving. Counting organizations without filtering on type overstates providers."
    handled_by: "analysis/databricks_publish.py:TABLE_COMMENTS"
    evidence: frontend/public/api/v1/release-deltas.json
    status: active

  - id: sc-2026-10-12-oig-leie-blank-zero
    first_release: "2026-10-12"
    resource: OIG LEIE UPDATED.csv
    element: REINDATE and other not-applicable fields
    kind: upstream-file
    before: "Blank values written zero-padded, for example 00000000 in REINDATE"
    after: "A bare 0 in every one of those fields (file fetched 2026-10-12)"
    detected: "2026-10-13, during the 2026-10-07 reload."
    impact: "A filter on REINDATE = '00000000' matched no row, so every exclusion read as reinstated. H24 published 0 of 0 and the high-risk cohort ran on SAM alone until the ingest was fixed. This is an OIG file, not an NDH change."
    handled_by: "analysis/ingest_oig_leie.py:normalize_row"
    evidence: analysis/ingest_oig_leie.py
    status: resolved

  - id: sc-2026-10-13-ecw-endpoint-list-moved
    first_release: "2026-10-13"
    resource: eClinicalWorks endpoint list
    element: practice list URL
    kind: upstream-file
    before: "The /external/practiceList path on the same eClinicalWorks host"
    after: "https://fhir.eclinicalworks.com/ecwopendev/global/practiceList; the old path returns 406 Not Acceptable from 2026-10-13"
    detected: "2026-10-13, when the H51 vendor-file download failed for this source."
    impact: "H51 dropped the failed source and reported lower vendor attribution than it should have. Its floor warning fired, which is how it was caught. This is a vendor file, not an NDH change."
    handled_by: "analysis/h51_vendor_endpoint_attribution.py:SOURCES"
    evidence: analysis/h51_vendor_endpoint_attribution.py
    status: resolved
